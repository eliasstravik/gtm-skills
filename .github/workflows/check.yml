name: Verify workflow viewer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
        working-directory: skills/gtm-workflow/templates
      - run: node --test skills/gtm-agent/tests/*.test.mjs
      - run: node skills/gtm-workflow/tests/run.mjs skills/gtm-workflow/templates
      - run: npm run build
        working-directory: skills/gtm-workflow/templates
      - run: node node_modules/typescript/bin/tsc --noEmit
        working-directory: skills/gtm-workflow/templates
      - run: npm run build:share
        working-directory: skills/gtm-workflow/templates
      - run: node skills/gtm-workflow/tests/assert-share-build.mjs skills/gtm-workflow/templates/.output
