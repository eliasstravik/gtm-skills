name: GTM workflow templates

on:
  pull_request:
    paths:
      - "skills/gtm-workflow/**"
      - "tests/**"
      - "evals/gtm-workflow/scripts/**"
      - ".github/workflows/gtm-workflow-templates.yml"
  push:
    branches: [main]
    paths:
      - "skills/gtm-workflow/**"
      - "tests/**"
      - "evals/gtm-workflow/scripts/**"
      - ".github/workflows/gtm-workflow-templates.yml"

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: skills/gtm-workflow/templates/.nvmrc
          cache: npm
          cache-dependency-path: skills/gtm-workflow/templates/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: skills/gtm-workflow/templates
      - run: node --test tests/workflow-runtime.test.mjs
      - run: node --test evals/gtm-workflow/scripts/test-migration-generation.mjs
      - run: node --experimental-test-module-mocks --import ./skills/gtm-workflow/templates/node_modules/tsx/dist/loader.mjs --test tests/rows-lifecycle.test.mjs tests/agent-tools.test.mjs tests/execution-shape.test.mjs tests/model-cache.test.mjs tests/preflight.test.mjs tests/diagram-draft.test.mjs tests/provider-fixtures.test.mjs
      - run: node --test tests/batch-runtime.test.mjs
      - run: node --test evals/gtm-workflow/scripts/test-templates.mjs
