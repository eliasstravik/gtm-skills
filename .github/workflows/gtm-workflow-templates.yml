name: GTM workflow templates

on:
  pull_request:
    paths:
      - "skills/gtm-workflow/**"
      - "tests/**"
      - "evals/gtm-workflow/fixtures/commands.json"
      - ".github/workflows/gtm-workflow-templates.yml"
  push:
    branches: [main]
    paths:
      - "skills/gtm-workflow/**"
      - "tests/**"
      - "evals/gtm-workflow/fixtures/commands.json"
      - ".github/workflows/gtm-workflow-templates.yml"

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: skills/gtm-workflow/templates/.nvmrc
          cache: npm
          cache-dependency-path: skills/gtm-workflow/templates/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: skills/gtm-workflow/templates
      - name: Template unit tests
        run: >
          node --experimental-test-module-mocks
          --import ./skills/gtm-workflow/templates/node_modules/tsx/dist/loader.mjs
          --test tests/*.test.mjs
      - name: Template builds and checks an empty project
        working-directory: skills/gtm-workflow/templates
        run: |
          cp .env.example .env
          npm run build
          npm run gtm -- check
          npm run gtm -- help
