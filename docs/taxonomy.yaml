# Canonical GTM skill metadata values.
# This is the single source read by humans and validator scripts.
version: 1

function_tags:
  - sales
  - marketing
  - revops
  - customer-success
  - partnerships
  - growth

role_tags:
  - sdr
  - bdr
  - ae
  - full-cycle-seller
  - sales-ops
  - marketing-ops
  - cro
  - vp-sales
  - csm
  - partnerships-lead
  - founder

requires_context:
  context:
    description: Resolved GTM Context Project with Organization, Active Person, and GTM Workspace context.
    files:
      - organization.md
      - people/<person-id>.md
      - workspaces/<workspace-id>/context.md
  icps:
    description: Workspace Ideal Customer Profile definitions.
    files:
      - workspaces/<workspace-id>/icps.md
  personas:
    description: Workspace Persona definitions.
    files:
      - workspaces/<workspace-id>/personas.md
  scoring:
    description: Workspace scoring model or scoring criteria.
    files:
      - workspaces/<workspace-id>/scoring.md

composes:
  validate_against_skill_folders: true
  skill_folder_glob: skills/gtm-*

output_mode:
  - durable
  - ephemeral
  - mixed

supports:
  - one-off
  - bulk
